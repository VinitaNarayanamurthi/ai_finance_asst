version: '3.8'

services:
  ai-finance-asst:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai-finance-assistant
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ALPHA_VANTAGE_API_KEY=${ALPHA_VANTAGE_API_KEY}
    volumes:
      # Mount analysis output directory
      - ./analysis_output:/app/analysis_output
      # Mount chroma database for persistence
      - ./chroma_langchain_db:/app/chroma_langchain_db
      # Mount docs for RAG
      - ./docs:/app/docs
      # Mount tools directory with sample data
      - ./tools:/app/tools
    ports:
      - "8501:8501"
    restart: unless-stopped
    networks:
      - finance-network

networks:
  finance-network:
    driver: bridge
